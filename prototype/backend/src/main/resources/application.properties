# SIFAP 2.0 Backend Configuration

# Server
server.port=8080
server.servlet.context-path=/

# Spring
spring.application.name=sifap-backend

# Database - Default (local development)
spring.datasource.url=jdbc:postgresql://localhost:5432/sifap
spring.datasource.username=sifap
spring.datasource.password=sifap_local
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddm-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Security
app.jwt.secret=${SIFAP_JWT_SECRET:dev-secret-key-min-32-chars-long-for-dev}
app.jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Logging
logging.level.root=INFO
logging.level.br.gov.sifap=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
