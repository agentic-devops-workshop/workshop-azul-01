# SIFAP 2.0 Backend Configuration - Docker Environment

spring.datasource.url=jdbc:postgresql://postgres:5432/sifap
spring.datasource.username=sifap
spring.datasource.password=sifap_local

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.br.gov.sifap=INFO
